name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend - lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy, strict)
        run: mypy .

      # The full suite runs against the deterministic mock provider, so CI needs
      # no API key and makes no outbound model call.
      - name: Test with coverage gate
        env:
          LEXICLEAR_LLM_PROVIDER: mock
          LEXICLEAR_ENVIRONMENT: test
        run: pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend - lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint, including jsx-a11y)
        run: npm run lint

      - name: Type check (tsc, strict)
        run: npm run typecheck

      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  security:
    name: Security - dependencies and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install security tooling
        run: pip install bandit[toml]==1.8.6 pip-audit==2.9.0

      - name: Static analysis (bandit)
        working-directory: backend
        run: bandit -c pyproject.toml -r app

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: pip-audit --strict --progress-spinner off .

      - name: JavaScript dependency audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Fail if a secret was committed
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.md'; then
            echo "::error::A Google API key appears in the repository."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked."
            exit 1
          fi

  e2e:
    name: End to end and accessibility
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the production image
        run: docker build -t lexiclear:ci .

      # The container runs with the mock provider, so the end-to-end journey and
      # the WCAG audit run on the real built artefact with no API key.
      - name: Start the container
        run: |
          # The suite uploads a document per test, which the production rate
          # limits are deliberately tight enough to refuse. Rate limiting has its
          # own integration tests; here the limits are raised so they do not mask
          # the journey and accessibility assertions.
          docker run -d --name lexiclear -p 8000:7860 \
            -e LEXICLEAR_LLM_PROVIDER=mock \
            -e LEXICLEAR_ENVIRONMENT=test \
            -e LEXICLEAR_RATE_LIMIT_UPLOADS=600/minute \
            -e LEXICLEAR_RATE_LIMIT_ANALYSIS=600/minute \
            -e LEXICLEAR_RATE_LIMIT_QUESTIONS=600/minute \
            lexiclear:ci
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::The container did not become healthy."
          docker logs lexiclear
          exit 1

      - name: Install test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run end-to-end and accessibility suites
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Collect container logs on failure
        if: failure()
        run: docker logs lexiclear

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
